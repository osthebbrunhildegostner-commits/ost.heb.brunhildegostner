    .page {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      padding:
        max(18px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
    }

    header {
      width: min(1180px, 100%);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 18px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--text);
      text-decoration: none;
    }

    .brand-logo {
      width: 150px;
      height: 150px;
      object-fit: contain;
      flex: 0 0 auto;
      filter: drop-shadow(0 5px 15px rgba(93, 74, 90, .08));
    }

    .brand-name {
      display: flex;
      flex-direction: column;
      line-height: 1.05;
    }

    .brand-name strong {
      font-size: clamp(1.55rem, 2.5vw, 2.35rem);
      font-weight: 600;
      letter-spacing: .02em;
    }

    .brand-name span {
      margin-top: 5px;
      font-size: .76rem;
      color: var(--text-soft);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    nav {
      display: flex;
      gap: 24px;
      align-items: center;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--text-soft);
      text-decoration: none;
      font-size: .96rem;
      font-weight: 500;
      transition: opacity .2s ease;
    }

    nav a:hover {
      opacity: .65;
    }

    main {
      width: min(1180px, 100%);
      margin: 0 auto;
      flex: 1;
    }

    .hero {
      width: min(590px, 100%);
      padding: clamp(24px, 4vw, 46px);
      border: 1px solid var(--glass-border);
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 28px;
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin: 0 0 12px;
      text-transform: uppercase;
      letter-spacing: .18em;
      font-size: .76rem;
      font-weight: 700;
      color: var(--text-soft);
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2.25rem, 6vw, 4.6rem);
      line-height: .98;
      font-weight: 500;
      letter-spacing: -.04em;
    }

    .hero p {
      margin: 0;
      max-width: 48ch;
      font-size: clamp(1rem, 1.7vw, 1.16rem);
      line-height: 1.65;
      color: var(--text-soft);
    }

    footer {
      width: min(1180px, 100%);
      margin: 0 auto;
      font-size: .82rem;
      color: rgba(95,83,83,.72);
    }

    @media (max-width: 720px) {
      body {
        background-attachment: scroll;
        background-position: center center;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .brand-logo {
        width: 110px;
        height: 110px;
      }

      .brand-name strong {
        font-size: clamp(1.35rem, 5vw, 1.9rem);
      }

      nav {
        gap: 14px 18px;
      }

      main {
        padding: 0;
      }
    }

    @media (max-width: 420px) {
      .page {
        padding-left: 14px;
        padding-right: 14px;
      }

      nav {
        display: none;
      }
    }
  </style>
</head>
